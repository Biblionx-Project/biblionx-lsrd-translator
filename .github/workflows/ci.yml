name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Version consistency
        run: python scripts/check_version.py

      - name: Unit tests (image fixture is committed)
        run: python -m unittest discover -s tests -v

      - name: Evaluate translator (gold corpus and realistic paragraphs)
        run: |
          python scripts/evaluate.py \
            --corpus tests/data/eval_corpus.json \
            --corpus tests/data/eval_corpus_realistic.json \
            --out /tmp/m.json

      - name: Quality gate
        run: |
          python scripts/check_metrics.py /tmp/m.json \
            --min-coverage 0.88 --min-recall 0.95 --min-precision 0.93 \
            --max-fingerspelling-rate 0.12 --min-order-accuracy 1.0 --max-p95-ms 500

      # Realistic web paragraphs (no gold lemmas). Measured after the vocabulary
      # expansion: coverage 0.7802, common-word fingerspelling 0.2103. Proper
      # nouns are legitimately spelled, so only common words are gated; the
      # limits sit slightly above/below the measured values.
      - name: Quality gate (realistic corpus)
        run: |
          python scripts/check_metrics.py /tmp/m.json --corpus eval_corpus_realistic \
            --min-coverage 0.75 --max-common-fingerspelling-rate 0.235 --max-p95-ms 500

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check JavaScript
        run: |
          set -e
          for f in browser_extension/*.js backend_api/web/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Secret pattern scan
        run: |
          if grep -rIE --exclude-dir=.git --exclude-dir=node_modules --exclude=ci.yml \
               -e 'sk-ant-[A-Za-z0-9_-]{8,}' -e 'ghp_[A-Za-z0-9]{20,}' -e 'AKIA[0-9A-Z]{16}' . ; then
            echo "Possible secret found" >&2
            exit 1
          fi
          echo "No secret patterns found"
