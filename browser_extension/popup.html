<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblionx Settings</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon.svg" alt="" width="36" height="36">
      <div><h1>Biblionx LSRD</h1><p>Dominican Sign Language translator</p></div>
    </header>
    <form id="form">
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="url" inputmode="url" spellcheck="false" placeholder="http://127.0.0.1:8000" required>
      <label for="speed">Default speed <output id="speedOut">1x</output></label>
      <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1">
      <button type="submit">Save</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="hint">Select text on any page, then use the floating button or right-click and choose "Translate to LSRD".</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
